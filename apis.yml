aid: dwelly
name: Dwelly
description: 'Dwelly (legal entity PROSPIRE TECHNOLOGIES LTD, also trading as Dwelly Group)
  is a UK-based, AI-first lettings and property-management company founded in 2023 by Ilya
  Drozdov (CEO), Dan Lifshits (CPO) and Dmitry Khanukov (CTO). Rather than selling software,
  Dwelly grows by acquiring independent UK lettings agencies and succession-planning their
  owners out, then running the acquired books on its own AI-powered operating platform. That
  platform automates tenant find (self-service enquiry chat, virtual viewings, verified offers),
  banking-grade tenant screening (KYC, Right to Rent, referencing), Direct Debit rent collection
  with automatic reconciliation and arrears handling, maintenance and property management
  workflows with centralised communications, and continuous lettings compliance. Dwelly is
  backed by General Catalyst, Begin Capital and S16VC. As of this profile Dwelly publishes no
  public API, developer portal, SDKs or technical documentation — the platform is operated
  internally for its own and its acquired agencies'' portfolios.'
